<body class="game game--duel">
  <noscript><p class="noscript">The 1v1 mode needs JavaScript. <a href="/">Play solo</a> or <a href="/about">read about the cats</a>.</p></noscript>

  <main id="app" class="app">
    <header class="hud hud--duel" aria-label="Match status">
      <div class="duel-hud">
        <div class="duel-hud__player duel-hud__player--1">
          <span class="duel-hud__name" id="hudName1">You</span>
          <span class="duel-hud__score" id="hudScore1">0</span>
          <span class="duel-hud__wins" id="hudWins1" aria-label="Rounds won"></span>
        </div>
        <div class="duel-hud__mid">
          <span class="hud__label">Round <b id="hudRound">1</b></span>
          <span class="duel-hud__clock" id="hudClock">60</span>
        </div>
        <div class="duel-hud__player duel-hud__player--2">
          <span class="duel-hud__name" id="hudName2">Opponent</span>
          <span class="duel-hud__score" id="hudScore2">0</span>
          <span class="duel-hud__wins" id="hudWins2" aria-label="Rounds won"></span>
        </div>
      </div>
      <div class="duel-bar" aria-hidden="true"><div id="roundFill" class="duel-bar__fill"></div></div>
    </header>
    <div class="hud__actions">
      <button id="soundBtn" class="info-btn" type="button" aria-label="Mute sound" aria-pressed="false">
        <svg class="ico-on" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="ico-off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <a class="info-btn" href="/" aria-label="Back to solo game">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </a>
    </div>

    <section id="field" class="field" aria-label="Shared lawn">
      <span id="tag1" class="cat__tag"><span class="cat__tag-name" id="tagName1">Player 1</span><span class="cat__tag-score" id="tagScore1">0</span></span>
      <span id="tag2" class="cat__tag"><span class="cat__tag-name" id="tagName2">Player 2</span><span class="cat__tag-score" id="tagScore2">0</span></span>
      <div id="toast" class="toast" data-kind="" aria-hidden="true"></div>
      <div id="countdown" class="countdown" aria-live="assertive" hidden></div>
      <div class="vignette" aria-hidden="true"></div>
      <div id="loading" class="loading" aria-hidden="true"><span class="spinner"></span></div>
    </section>

    <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="overlayTitle">
      <div class="overlay__card overlay__card--wide">
        <!-- lobby -->
        <div id="panelLobby" class="panel">
          <h1 id="overlayTitle" class="overlay__title">1v1 Online</h1>
          <p class="online" data-online hidden><span class="online__dot" aria-hidden="true"></span><span class="online__text"></span></p>
          <p class="overlay__text overlay__text--center">Your cat vs theirs, one lawn. Best of three 60-second rounds.</p>
          <label class="field-row"><span class="hud__label">Your name</span><input id="nameInput" class="input" type="text" maxlength="14" autocomplete="nickname" placeholder="Whiskers" spellcheck="false"></label>
          <div class="overlay__actions">
            <button id="quickBtn" class="btn btn--primary" type="button">Quick match</button>
            <button id="createBtn" class="btn" type="button">Create room</button>
          </div>
          <form id="joinForm" class="join">
            <input id="codeInput" class="input input--code" type="text" maxlength="5" placeholder="ROOM CODE" autocapitalize="characters" autocomplete="off" spellcheck="false">
            <button class="btn" type="submit">Join</button>
          </form>
          <p id="lobbyError" class="overlay__error" hidden></p>
          <section class="leader" aria-labelledby="leaderTitle">
            <h2 id="leaderTitle" class="leader__title">Top cats</h2>
            <ol id="leaderList" class="leader__list"><li class="leader__empty">No matches yet. Be the first!</li></ol>
          </section>
          <nav class="overlay__links" aria-label="More"><a class="link-btn" href="/">← Solo mode</a><a class="link-btn" href="/how-to-play#1v1-online">Rules</a></nav>
          <p class="legal"><a href="/terms">Terms</a> · <a href="/privacy">Privacy</a></p>
        </div>
        <!-- waiting -->
        <div id="panelWait" class="panel" hidden>
          <h2 class="overlay__title">Waiting for a rival…</h2>
          <p class="overlay__text" id="waitText">Share this code or link with a friend.</p>
          <p class="online" data-online hidden><span class="online__dot" aria-hidden="true"></span><span class="online__text"></span></p>
          <div id="codeBox" class="code-box"><span id="codeText" class="code-box__code">—</span><button id="copyBtn" class="btn" type="button">Copy link</button></div>
          <div class="spinner" aria-hidden="true"></div>
          <button id="cancelBtn" class="link-btn" type="button">Cancel</button>
        </div>
        <!-- round end / final -->
        <div id="panelResult" class="panel" hidden>
          <h2 class="overlay__title" id="resultTitle">Round over</h2>
          <p class="overlay__text" id="resultText"></p>
          <table class="ranking" id="rankingTable"></table>
          <div class="overlay__actions">
            <button id="againBtn" class="btn btn--primary" type="button" hidden>Play again</button>
            <button id="shareBtn" class="btn" type="button" hidden>Share</button>
          </div>
          <p class="overlay__stats" id="resultCountdown" hidden></p>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/src/multi.ts"></script>
